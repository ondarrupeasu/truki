<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Truki · Admin</title>
<style>
  :root{
    --paper:#f5f5ee; --card:#fffffb; --ink:#201f19; --muted:#6c6a5f; --line:#e7e4d7; --line-2:#dcd8c7;
    --give:#158a63; --get:#ef5f4c; --gold:#c98a1e; --give-soft:#e2f1ea;
    --shadow:0 1px 0 rgba(0,0,0,.02), 0 12px 30px -20px rgba(40,30,10,.35);
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){:root{
    --paper:#14140f; --card:#1e1d16; --ink:#efece1; --muted:#a3a091; --line:#2c2a21; --line-2:#3a372c;
    --give:#2fc38a; --get:#ff7a68; --gold:#e0aa4c; --give-soft:#132a22;
    --shadow:0 1px 0 rgba(255,255,255,.02), 0 14px 34px -22px rgba(0,0,0,.7);
  }}
  *{box-sizing:border-box}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.5;
    min-height:100dvh; display:flex; justify-content:center}
  .wrap{width:100%; max-width:520px; padding:26px 20px 60px}
  .brand{font-weight:850; font-size:24px; letter-spacing:-.02em; margin-bottom:2px}
  .brand b{color:var(--give)} .brand i{font-style:normal; color:var(--get)}
  .kicker{font-family:var(--mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin-bottom:22px}
  h2{font-size:20px; margin:2px 0 10px}
  label{display:block; font-weight:700; font-size:13px; margin:14px 0 7px}
  input{width:100%; font:inherit; font-size:16px; padding:13px 14px; border-radius:12px; border:1.5px solid var(--line-2);
    background:var(--card); color:var(--ink)}
  input:focus{outline:2px solid var(--give); border-color:var(--give)}
  .btn{appearance:none; border:0; font-family:inherit; font-weight:800; font-size:15px; cursor:pointer; border-radius:12px;
    padding:13px 16px; width:100%}
  .btn.give{background:var(--give); color:#fff} .btn.get{background:var(--get); color:#fff}
  .btn.ghost{background:transparent; color:var(--ink); border:1.5px solid var(--line-2)}
  .btn.sm{width:auto; padding:9px 13px; font-size:13px}
  .btn[disabled]{opacity:.5; cursor:not-allowed}
  .err{color:var(--get); font-weight:700; font-size:13.5px; margin-top:12px; min-height:18px}
  .item{display:flex; gap:12px; align-items:center; background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:11px 14px; margin-bottom:9px; box-shadow:var(--shadow)}
  .item .tt{font-weight:750; font-size:15px}
  .item .st{font-size:12.5px; color:var(--muted)}
  .row-r{margin-left:auto; display:flex; align-items:center; gap:10px}
  .pt{font-weight:850; color:var(--gold); font-size:14px}
  .bar{display:flex; align-items:center; gap:10px; margin-bottom:16px}
  .bar .sp{flex:1}
  .muted{color:var(--muted); font-size:13.5px}
  .danger{margin-top:20px; border-top:1px solid var(--line); padding-top:16px}
  dialog{border:0; border-radius:16px; padding:20px; max-width:340px; width:90%; background:var(--card); color:var(--ink); box-shadow:var(--shadow)}
  dialog::backdrop{background:rgba(20,15,5,.5)}
  .hidden{display:none!important}
</style>

<div class="wrap">
  <div class="brand"><b>Tru</b><i>ki</i></div>
  <div class="kicker">Panel de administración</div>

  <!-- LOGIN -->
  <section id="login">
    <h2>Entrar</h2>
    <label>Contraseña de admin</label>
    <input id="pass" type="password" placeholder="contraseña" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <div class="err" id="login-err"></div>
    <button class="btn give" id="login-btn" onclick="doLogin()">Entrar</button>
    <p class="muted" style="margin-top:16px">Esta página es solo para administrar Truki. Volver a la app: <a href="/" style="color:var(--give)">truki.cinemafilmak.com</a></p>
  </section>

  <!-- PANEL -->
  <section id="panel" class="hidden">
    <div class="bar">
      <h2 style="margin:0">Cuentas</h2>
      <div class="sp"></div>
      <button class="btn ghost sm" onclick="loadUsers()">↻ Refrescar</button>
      <button class="btn ghost sm" onclick="logout()">Salir</button>
    </div>
    <div id="users"></div>
    <div class="danger">
      <button class="btn ghost" style="color:var(--get);border-color:var(--get)" onclick="askReset()">🧨 Vaciar TODO (empezar de cero)</button>
      <p class="muted" style="margin-top:8px">Borra todas las cuentas, prendas y datos. Úsalo antes del estreno.</p>
    </div>
  </section>
</div>

<dialog id="dlg">
  <h2 id="dlg-title" style="margin-top:0"></h2>
  <p id="dlg-body" class="muted"></p>
  <div style="display:flex; gap:10px; margin-top:8px">
    <button class="btn ghost" onclick="document.getElementById('dlg').close()">Cancelar</button>
    <button class="btn get" id="dlg-ok">Confirmar</button>
  </div>
</dialog>

<script>
const API = "/api/index.php";
let ATOK = sessionStorage.getItem("truki_admin") || null;

async function api(action, body){
  const opt = { method: body ? "POST" : "GET", headers: {} };
  if (ATOK) opt.headers["Authorization"] = "Bearer " + ATOK;
  if (body){ opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  const r = await fetch(API + "?a=" + action, opt);
  let j; try { j = await r.json(); } catch { j = { error: "Respuesta no válida" }; }
  if (!r.ok) throw new Error(j.error || ("Error " + r.status));
  return j;
}
const $ = id => document.getElementById(id);

async function doLogin(){
  const p = $("pass").value; const err = $("login-err"); err.textContent = "";
  if (!p){ err.textContent = "Pon la contraseña."; return; }
  $("login-btn").disabled = true;
  try{
    const r = await api("admin_login", { password: p });
    ATOK = r.token; sessionStorage.setItem("truki_admin", ATOK);
    showPanel();
  }catch(e){ err.textContent = e.message; }
  finally{ $("login-btn").disabled = false; }
}
function logout(){ ATOK = null; sessionStorage.removeItem("truki_admin"); $("pass").value=""; $("panel").classList.add("hidden"); $("login").classList.remove("hidden"); }

async function showPanel(){
  $("login").classList.add("hidden"); $("panel").classList.remove("hidden");
  await loadUsers();
}
async function loadUsers(){
  const box = $("users"); box.innerHTML = '<p class="muted">Cargando…</p>';
  try{
    const r = await api("admin_users");
    if (!r.users.length){ box.innerHTML = '<p class="muted">No hay ninguna cuenta.</p>'; return; }
    box.innerHTML = r.users.map(u => `
      <div class="item">
        <div><div class="tt">${esc(u.username)}</div><div class="st">id ${u.id} · ${u.items} prenda(s)</div></div>
        <div class="row-r"><span class="pt">${u.points} 🪙</span>
          <button class="btn get sm" onclick="askDel(${u.id}, '${esc(u.username).replace(/'/g,"\\'")}')">Borrar</button></div>
      </div>`).join("");
  }catch(e){
    if (/admin/i.test(e.message)){ logout(); return; }
    box.innerHTML = `<p class="err">${esc(e.message)}</p>`;
  }
}
function askDel(id, name){
  dlg(`Borrar "${name}"`, "Se borra la cuenta y todas sus prendas. No se puede deshacer.", async () => {
    try{ await api("admin_delete_user", { id }); await loadUsers(); }catch(e){ alert(e.message); }
  });
}
function askReset(){
  dlg("Vaciar TODO", "Borra TODAS las cuentas, prendas y datos. Esto no se puede deshacer. ¿Seguro?", async () => {
    try{ await api("admin_reset", { confirm: 1 }); await loadUsers(); }catch(e){ alert(e.message); }
  });
}
function dlg(title, bodyTxt, onOk){
  $("dlg-title").textContent = title; $("dlg-body").textContent = bodyTxt;
  const ok = $("dlg-ok"); const fresh = ok.cloneNode(true); ok.parentNode.replaceChild(fresh, ok);
  fresh.onclick = async () => { $("dlg").close(); await onOk(); };
  $("dlg").showModal();
}
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

if (ATOK) showPanel(); else $("pass").focus();
</script>
